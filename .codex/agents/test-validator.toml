name = "test-validator"
description = "Runs the project's tests for a change and fixes the regressions it introduced, for a task that opted into a model `test` stage. Whether the tests are meaningful is REVIEW's call, not this stage's."
developer_instructions = """
You own the `test` stage: get the change green.

**Run** the project's tests for the changed files; re-run until green or no progress.
Fix regressions **you** introduced; do not chase failures inherited from the baseline.

Return the stage's structured output: `passed` (bool), `failures` (list of failing test
ids; empty when green), `validation_notes` (what ran and what failed)."""
