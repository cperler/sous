[project]
name = "orchestration-template"
version = "0.1.0"
description = "Installable, project-agnostic orchestration engine + interactive/headless execution lanes and project-config adapters"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.6",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"
orchestrator-scaffold = "orchestrator.scaffold:main"

# The in-repo reference project-config adapters, registered so the engine can resolve
# them by short name (`--project heysoo`) via entry-point discovery — the same seam any
# third-party package uses to ship its own adapter. This self-tests the mechanism.
[project.entry-points."orchestrator.project_adapters"]
heysoo = "adapters.project.heysoo"
selfhost = "adapters.project.selfhost"

[dependency-groups]
dev = [
    "hypothesis>=6.156.1",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "adapters"]

# The starter kit (templates/project-default/ — schemas, agents, hooks, skills, manifest)
# lives at the repo root for a source checkout but must ride inside the wheel so an
# installed `orchestrator-scaffold` can seed it. Force-include it under the package;
# scaffold._kit_dir() resolves either layout.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "orchestrator/templates"

[tool.hatch.build.targets.sdist]
include = ["orchestrator", "adapters", "templates", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: builds a wheel + throwaway venv (the install smoke test); deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE"]
ignore = ["E501"]  # line length handled pragmatically in tests/fixtures

[tool.mypy]
# Type-check the shipped code (engine + adapters). Tests stay out of the gate;
# they lean on dynamic fixtures and would drown the signal.
files = ["orchestrator", "adapters"]
python_version = "3.11"

# jsonschema ships no type stubs — silence the import-untyped errors structurally
# here rather than sprinkling per-line ignores at each import.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

# Per-module strictness ratchet (#210, completed by #241). The global default
# stays lenient (annotations optional), but these modules are fully annotated and
# clean, so we gate them: a future un-annotated def in any of them now FAILS
# `mypy` instead of silently degrading. This is a config-only ratchet — flip a
# module out of the default set and into this list once its defs are annotated.
#
# Ratchet complete: every shipped module under files = ["orchestrator", "adapters"]
# is now listed here (#241 promoted the final 10 that still carried un-annotated
# defs). A NEW module added to the tree is lenient by default until it is added
# below — add it here once its defs are annotated so the gate keeps biting.
[[tool.mypy.overrides]]
module = [
    "orchestrator",
    "orchestrator.alerting",
    "orchestrator.batch_plan",
    "orchestrator.brainstorm",
    "orchestrator.capacity",
    "orchestrator.cli",
    "orchestrator.cost_ledger",
    "orchestrator.cost_policy",
    "orchestrator.dag",
    "orchestrator.dashboard",
    "orchestrator.engine",
    "orchestrator.errors",
    "orchestrator.failure_classifier",
    "orchestrator.learnings_kb",
    "orchestrator.model_table",
    "orchestrator.port_registry",
    "orchestrator.project_loader",
    "orchestrator.queue_file",
    "orchestrator.render",
    "orchestrator.retrospective",
    "orchestrator.retry",
    "orchestrator.routing",
    "orchestrator.scaffold",
    "orchestrator.scheduler",
    "orchestrator.schemas",
    "orchestrator.schemas.enums",
    "orchestrator.schemas.stage_schemas",
    "orchestrator.schemas.status",
    "orchestrator.schemas.work",
    "orchestrator.spec_conformance",
    "orchestrator.spec_intake",
    "orchestrator.stages",
    "orchestrator.state_machine",
    "orchestrator.status_store",
    "orchestrator.stream_probe",
    "orchestrator.usage_probe",
    "orchestrator.web_dashboard",
    "adapters",
    "adapters.execution",
    "adapters.execution.base",
    "adapters.execution.codex",
    "adapters.execution.deterministic_deliver",
    "adapters.execution.deterministic_setup",
    "adapters.execution.deterministic_test",
    "adapters.execution.headless_claude",
    "adapters.execution.install_cache",
    "adapters.execution.interactive",
    "adapters.execution.runners",
    "adapters.execution.transport",
    "adapters.project",
    "adapters.project.base",
    "adapters.project.github_issues",
    "adapters.project.heysoo",
    "adapters.project.heysoo.classifier",
    "adapters.project.heysoo.config",
    "adapters.project.heysoo.task_source",
    "adapters.project.selfhost",
    "adapters.project.selfhost.classifier",
    "adapters.project.selfhost.config",
    "adapters.project.selfhost.task_source",
]
disallow_untyped_defs = true
