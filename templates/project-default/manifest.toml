# Project starter-kit menu.
#
# The bootstrap skill (run_targets/adapter_bootstrap_skill.md) and the profile-driven
# scaffold read this to decide WHICH assets to roll into a new project, based on the
# project's stack profile (languages + layers). Agents/hooks carry stack `tags`; an
# empty `tags` list means "generic, always available". Stage schemas are universal.
#
# Edit this file (and the assets it points at) to customize what every future
# scaffolded project starts from — this is the "default project template" source.

[meta]
version = "1"
description = "Default orchestration starter kit: agents, skills, hooks, schemas."

# ── Agents: which stage (sub-)role each can serve + the stack tags that select it ──
[agents.generic-implementer]
roles = ["implement"]
tags = []                       # fallback implementer when no stack agent fits
[agents.code-simplifier]
roles = ["simplify"]
tags = []
[agents.code-reviewer]
roles = ["review"]
tags = []
[agents.spec-reviewer]
roles = ["review:spec"]
tags = []
[agents.test-validator]
roles = ["test"]
tags = []
[agents.docstring-writer]
roles = ["docstring"]
tags = []
[agents.python-backend-developer]
roles = ["implement"]
tags = ["python"]
[agents.typescript-frontend-developer]
roles = ["implement:frontend"]
tags = ["typescript"]
[agents.design-reviewer]
roles = ["review:design"]                # design-craft lens for frontend review
tags = ["typescript"]                    # rides the frontend stack (the kit's UI language)

# ── Hooks: .claude hooks the bootstrap merges into the project's settings.json.
#    Empty tags = always seeded (the safety guards); language tags = per-stack. ──
[hooks.guard-sensitive-files]
tags = []                       # SAFETY: always on — block edits to env/credential/.git files
description = "Deny model edits to .env/credentials/.git-internal files (exit 2)."
[hooks.guard-deploy]
tags = []                       # SAFETY: always on — block deploy-shaped Bash commands
description = "Deny deploy-shaped Bash commands (deploy_to_production, terraform apply, cdk deploy)."
[hooks.python-format]
tags = ["python"]
description = "Run ruff format on edited Python files."
[hooks.typescript-format]
tags = ["typescript"]
description = "Run prettier on edited TS/JS files."

# ── Skills: the run-lane supervisor skills + the post-run triage gate (always copied) ──
# These files are byte-identical copies of this repo's own `.claude/skills/<name>/SKILL.md`
# and `tests/test_kit_skills_in_sync.py` fails if they drift: a scaffolded project must not
# receive an older generation of a skill than the one this repo runs.
[skills]
always = [
    "orchestrate-task-interactive",
    "orchestrate-batch-interactive",
    "orchestrate-batch-headless",
    "triage-followups",
]

# ── Stack -> default adapter commands (the interview maps answers to these) ──
# ── Worktree provenance: what a disposable REVIEW checkout must NOT inherit (#391) ──
# A copied virtualenv carries console-script shebangs hardcoded to the worktree it was
# built in, so `pytest`/`mypy` can silently run against ANOTHER worktree's source. The
# scaffold turns these into the adapter's fresh_install_paths() + worktree_origin_probes();
# `launcher_dir` is only used for package managers whose scripts live in the project tree,
# and only for commands declared in the bare-console-script form — the `python -m ...`
# commands below are proven by an interpreter probe instead (#396).
[worktree.python]
fresh_install_paths = [".venv"]
launcher_dir = ".venv/bin"

# Module invocation (`python -m <tool>`), not the bare console script (#396). A console
# script bakes its interpreter into a shebang, so a `.venv` copied from another worktree
# runs THAT worktree's python; `python -m` resolves the interpreter through the runner and
# cannot inherit a stale path at all. This is the prevention half of #391's detection half
# — and it is why a python profile's origin probe proves the INTERPRETER, not a launcher.
[commands.python]
install = ["uv", "sync"]
test_unit = ["uv", "run", "python", "-m", "pytest", "-q"]
lint = ["uv", "run", "python", "-m", "ruff", "check", "."]
typecheck = ["uv", "run", "python", "-m", "mypy", "."]
[commands.typescript]
install = ["pnpm", "install"]
test_unit = ["pnpm", "test"]
test_e2e = ["pnpm", "exec", "playwright", "test"]
typecheck = ["pnpm", "exec", "tsc", "--noEmit"]
[commands.node]
install = ["npm", "ci"]
test_unit = ["npm", "test"]
[commands.go]
install = ["go", "mod", "download"]
test_unit = ["go", "test", "./..."]
[commands.rust]
install = ["cargo", "fetch"]
test_unit = ["cargo", "test"]
